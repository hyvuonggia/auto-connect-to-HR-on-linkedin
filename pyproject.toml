[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-auto-connect"
version = "0.2.0"
description = "Send LinkedIn connection requests to HR and recruiter profiles with Playwright."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
linkedin-auto-connect = "linkedin_auto_connect.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
